name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site with Telegram secrets
        env:
          TELEGRAM_USERNAME: ${{ secrets.TELEGRAM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p _site
          cp index.html privacy.html offer.html robots.txt sitemap.xml _site/
          cp -r css js assets _site/

          python3 <<'PY'
          import os, pathlib, re
          path = pathlib.Path("_site/js/config.js")
          text = path.read_text(encoding="utf-8")

          username = (os.environ.get("TELEGRAM_USERNAME") or "").strip() or "soberi_sebya_sam_bot"
          token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()

          print(f"secret lengths: username={len(username)} token={len(token)} chat_id={len(chat_id)}")

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace('"', '\\"')

          if token and chat_id:
              text = text.replace("TELEGRAM_BOT_TOKEN_PLACEHOLDER", esc(token))
              text = text.replace("TELEGRAM_CHAT_ID_PLACEHOLDER", esc(chat_id))
              text = text.replace("TELEGRAM_USERNAME_PLACEHOLDER", esc(username))
              text = re.sub(
                  r'telegramUsername:\s*"[^"]*"',
                  f'telegramUsername: "{esc(username)}"',
                  text,
                  count=1,
              )
              if "PLACEHOLDER" in text:
                  raise SystemExit("placeholders remain after injection")
              print("Telegram config injected OK (form → Telegram API)")
          else:
              # Keep username for deep-link buttons; form will open Telegram draft
              text = re.sub(
                  r'telegramUsername:\s*"[^"]*"',
                  f'telegramUsername: "{esc(username)}"',
                  text,
                  count=1,
              )
              print("WARN: TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID empty — buttons work, form uses Telegram draft link")
              print("Add Repository secrets (Settings → Secrets and variables → Actions):")
              print("  TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, TELEGRAM_USERNAME")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
