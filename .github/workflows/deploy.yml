name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site with Telegram secrets
        env:
          TELEGRAM_USERNAME: ${{ secrets.TELEGRAM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p _site
          cp index.html privacy.html offer.html robots.txt sitemap.xml _site/
          cp -r css js assets _site/

          python3 <<'PY'
          import os, pathlib, sys
          path = pathlib.Path("_site/js/config.js")
          text = path.read_text(encoding="utf-8")

          username = os.environ.get("TELEGRAM_USERNAME", "").strip() or "soberi_sebya_sam_bot"
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          print(f"secret lengths: username={len(username)} token={len(token)} chat_id={len(chat_id)}")

          if not token or not chat_id:
              print("ERROR: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be set as repository Actions secrets.")
              print("GitHub → Settings → Secrets and variables → Actions (not Environments, unless named github-pages).")
              sys.exit(1)

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace('"', '\\"')

          # Replace placeholders and also hardcode username field if needed
          text = text.replace("TELEGRAM_BOT_TOKEN_PLACEHOLDER", esc(token))
          text = text.replace("TELEGRAM_CHAT_ID_PLACEHOLDER", esc(chat_id))
          text = text.replace("TELEGRAM_USERNAME_PLACEHOLDER", esc(username))
          # Ensure username is present even if already hardcoded
          import re
          text = re.sub(
              r'telegramUsername:\s*"[^"]*"',
              f'telegramUsername: "{esc(username)}"',
              text,
              count=1,
          )

          if "PLACEHOLDER" in text:
              print("ERROR: placeholders remain after injection")
              sys.exit(1)

          path.write_text(text, encoding="utf-8")
          print("Telegram config injected OK")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
