name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          TELEGRAM_USERNAME: ${{ secrets.TELEGRAM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p _site
          cp index.html privacy.html offer.html robots.txt sitemap.xml _site/
          cp -r css js assets _site/
          python3 <<'PY'
          import os, pathlib
          path = pathlib.Path("_site/js/config.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "TELEGRAM_USERNAME_PLACEHOLDER": os.environ.get("TELEGRAM_USERNAME", "").strip(),
              "TELEGRAM_BOT_TOKEN_PLACEHOLDER": os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(),
              "TELEGRAM_CHAT_ID_PLACEHOLDER": os.environ.get("TELEGRAM_CHAT_ID", "").strip(),
          }
          for key, value in replacements.items():
              text = text.replace(key, value.replace("\\", "\\\\").replace('"', '\\"'))
          path.write_text(text, encoding="utf-8")
          print("Telegram config injected:", bool(replacements["TELEGRAM_USERNAME_PLACEHOLDER"]))
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
