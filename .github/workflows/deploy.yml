name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site with Telegram secrets
        env:
          TELEGRAM_USERNAME: ${{ secrets.TELEGRAM_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p _site
          cp index.html privacy.html offer.html robots.txt sitemap.xml _site/
          cp -r css js assets _site/

          python3 <<'PY'
          import os, pathlib, re
          path = pathlib.Path("_site/js/config.js")
          text = path.read_text(encoding="utf-8")

          username = (os.environ.get("TELEGRAM_USERNAME") or "").strip() or "soberi_sebya_sam_bot"
          token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip() or "75264340"

          print(f"secret lengths: username={len(username)} token={len(token)} chat_id={len(chat_id)}")

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace('"', '\\"')

          text = re.sub(r'telegramUsername:\s*"[^"]*"', f'telegramUsername: "{esc(username)}"', text, count=1)
          text = re.sub(r'telegramChatId:\s*"[^"]*"', f'telegramChatId: "{esc(chat_id)}"', text, count=1)

          if token:
              text = text.replace("TELEGRAM_BOT_TOKEN_PLACEHOLDER", esc(token))
              text = re.sub(r'telegramBotToken:\s*"[^"]*"', f'telegramBotToken: "{esc(token)}"', text, count=1)
              print("Telegram token injected OK")
          else:
              print("WARN: TELEGRAM_BOT_TOKEN empty — form will open Telegram draft instead of API")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
